<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HoloInsights</title>
<style>
  body {
    margin: 0;
    padding: 32px 20px;
    background: #0a0e17;
    color: #eef1f7;
    font-family: system-ui, sans-serif;
  }
  .wrap { max-width: 880px; margin: 0 auto; }
  .wordmark { font-size: 15px; font-weight: 700; letter-spacing: 0.1em; margin-bottom: 30px; }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .card {
    background: #131b2b;
    border: 1px solid #232d42;
    border-radius: 10px;
    padding: 18px;
  }
  .card .label { font-size: 12px; color: #8b95ab; margin-bottom: 10px; }
  .card .value { font-size: 26px; font-weight: 600; }
  .card .delta { font-size: 12px; margin-top: 8px; color: #5eead4; }
</style>
</head>
<body>
<div class="wrap">
  <div class="wordmark">HOLOINSIGHTS</div>
  <div class="cards">
    <div class="card">
      <div class="label">Total revenue, Q3</div>
      <div class="value">$13.7M</div>
      <div class="delta">▲ 18% QoQ</div>
    </div>
    <div class="card">
      <div class="label">Top region</div>
      <div class="value">APAC</div>
      <div class="delta">▲ 34% growth</div>
    </div>
    <div class="card">
      <div class="label">Needs attention</div>
      <div class="value">EMEA</div>
      <div class="delta">▼ 6% decline</div>
    </div>
    </div>

  <div id="scene-container" style="width:100%; height:300px; margin-top:24px; border:1px solid #232d42; border-radius:10px;"></div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
  const container = document.getElementById('scene-container');

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 1000);
  camera.position.set(0, 2, 6);
  camera.lookAt(0, 0, 0);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(container.clientWidth, container.clientHeight);
  container.appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0x404060));
  const light = new THREE.DirectionalLight(0xffffff, 1);
  light.position.set(3, 5, 5);
  scene.add(light);

  // Sample data: revenue by region ($M)
  const data = [
    { label: 'NA', value: 4.2, color: 0x5eead4 },
    { label: 'EMEA', value: 2.6, color: 0xe8746b },
    { label: 'APAC', value: 5.1, color: 0x5eead4 },
    { label: 'LatAm', value: 1.8, color: 0x5eead4 },
  ];

  const barWidth = 0.8;
  const spacing = 1.3;
  const startX = -((data.length - 1) * spacing) / 2;
  const bars = [];

  data.forEach((d, i) => {
    const height = d.value * 0.6; // scale value to a reasonable 3D height
    const geometry = new THREE.BoxGeometry(barWidth, height, barWidth);
    const material = new THREE.MeshStandardMaterial({ color: d.color });
    const bar = new THREE.Mesh(geometry, material);
    bar.position.x = startX + i * spacing;
    bar.position.y = height / 2; // so it sits on the "floor" instead of centered
    scene.add(bar);
    bars.push(bar);
  });

  function animate() {
    requestAnimationFrame(animate);
    scene.rotation.y += 0.003; // slow spin so all bars are visible
    renderer.render(scene, camera);
  }
  animate();
</script>
</body>
</html>
