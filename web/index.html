<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HoloInsights</title>
<style>
  body {
    margin: 0;
    padding: 32px 20px;
    background: #0a0e17;
    color: #eef1f7;
    font-family: system-ui, sans-serif;
  }
  .wrap { max-width: 880px; margin: 0 auto; }
  .wordmark { font-size: 15px; font-weight: 700; letter-spacing: 0.1em; margin-bottom: 30px; }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .card {
    background: #131b2b;
    border: 1px solid #232d42;
    border-radius: 10px;
    padding: 18px;
  }
  .card .label { font-size: 12px; color: #8b95ab; margin-bottom: 10px; }
  .card .value { font-size: 26px; font-weight: 600; }
  .card .delta { font-size: 12px; margin-top: 8px; color: #5eead4; }
</style>
</head>
<body>
<div class="wrap">
  <div class="wordmark">HOLOINSIGHTS</div>
  <div class="cards">
    <div class="card">
      <div class="label">Total revenue, Q3</div>
      <div class="value">$13.7M</div>
      <div class="delta">▲ 18% QoQ</div>
    </div>
    <div class="card">
      <div class="label">Top region</div>
      <div class="value">APAC</div>
      <div class="delta">▲ 34% growth</div>
    </div>
    <div class="card">
      <div class="label">Needs attention</div>
      <div class="value">EMEA</div>
      <div class="delta">▼ 6% decline</div>
    </div>
    </div>

  <div style="background:#101623; border:1px solid #232d42; border-left:3px solid #e8a33d; border-radius:0 10px 10px 0; padding:18px 20px; margin-top:24px;">
    <div style="font-size:11px; color:#e8a33d; margin-bottom:8px; letter-spacing:0.05em;">AI-NARRATED INSIGHT</div>
    <div id="insightText" style="font-size:15px; line-height:1.5;">Select a question below to see the AI-generated insight here.</div>
  </div>
  <div style="display:flex; align-items:center; gap:12px; margin-top:24px;">
    <button id="micBtn" style="width:44px; height:44px; border-radius:50%; border:1px solid #232d42; background:#131b2b; color:#eef1f7; cursor:pointer; font-size:18px;">🎙</button>
    <span id="micStatus" style="font-size:12px; color:#8b95ab;">Click the mic and ask a question out loud</span>
  </div>
  <div style="display:flex; gap:10px; margin-top:24px; flex-wrap:wrap;">
    <button class="q-btn" data-q="performance" style="background:#131b2b; border:1px solid #232d42; color:#eef1f7; padding:10px 16px; border-radius:20px; cursor:pointer; font-size:13px;">How did revenue perform this quarter?</button>
    <button class="q-btn" data-q="underperform" style="background:#131b2b; border:1px solid #232d42; color:#eef1f7; padding:10px 16px; border-radius:20px; cursor:pointer; font-size:13px;">Which region is underperforming?</button>
    <button class="q-btn" data-q="trend" style="background:#131b2b; border:1px solid #232d42; color:#eef1f7; padding:10px 16px; border-radius:20px; cursor:pointer; font-size:13px;">What's the monthly trend?</button>
  </div>
  <div id="scene-container" style="position:relative; width:100%; height:300px; margin-top:24px; border:1px solid #232d42; border-radius:10px; overflow:hidden;"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
  const container = document.getElementById('scene-container');

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 1000);
  camera.position.set(0, 1.1, 6.5);
  camera.lookAt(0, 0.7, 0);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(container.clientWidth, container.clientHeight);
  container.appendChild(renderer.domElement);

  const labelsLayer = document.createElement('div');
  labelsLayer.style.position = 'absolute';
  labelsLayer.style.top = '0';
  labelsLayer.style.left = '0';
  labelsLayer.style.width = '100%';
  labelsLayer.style.height = '100%';
  labelsLayer.style.pointerEvents = 'none';
  container.appendChild(labelsLayer);

  scene.add(new THREE.AmbientLight(0x404060));
  const light = new THREE.DirectionalLight(0xffffff, 1);
  light.position.set(3, 5, 5);
  scene.add(light);

  const datasets = {
    performance: [
      { label: 'NA', value: 4.2, color: 0x5eead4 },
      { label: 'EMEA', value: 2.6, color: 0x5eead4 },
      { label: 'APAC', value: 5.1, color: 0x5eead4 },
      { label: 'LatAm', value: 1.8, color: 0x5eead4 },
    ],
    underperform: [
      { label: 'NA', value: 4.2, color: 0x5eead4 },
      { label: 'EMEA', value: 2.6, color: 0xe8746b },
      { label: 'APAC', value: 5.1, color: 0x5eead4 },
      { label: 'LatAm', value: 1.8, color: 0x5eead4 },
    ],
    trend: [
      { label: 'Apr', value: 1.9, color: 0x5eead4 },
      { label: 'May', value: 2.1, color: 0x5eead4 },
      { label: 'Jun', value: 2.3, color: 0x5eead4 },
      { label: 'Jul', value: 2.6, color: 0x5eead4 },
      { label: 'Aug', value: 2.9, color: 0x5eead4 },
      { label: 'Sep', value: 3.1, color: 0x5eead4 },
    ],
  };

  const insightTexts = {
    performance: "Total revenue reached $13.7 million this quarter, up 18% from last quarter. APAC was the standout, growing 34% and now the largest contributor — North America held steady, while EMEA softened.",
    underperform: "EMEA is the region to watch — revenue fell 6% quarter over quarter, the only region in decline. Every other region grew.",
    trend: "Revenue has climbed every month since April, from $1.9 million to $3.1 million — a steady upward trend that accelerated in August and September.",
  };

  function speak(text) {
    if (!('speechSynthesis' in window)) return; // silently skip if unsupported
    window.speechSynthesis.cancel(); // stop any speech already playing
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.rate = 1.0;
    window.speechSynthesis.speak(utterance);
  }

  let currentBars = [];

  function animateBar(bar, fromScale, toScale, duration, onComplete) {
    const start = performance.now();
    const fullY = bar.userData.fullY;
    function step(now) {
      const t = Math.min((now - start) / duration, 1);
      const eased = 1 - Math.pow(1 - t, 3);
      const s = fromScale + (toScale - fromScale) * eased;
      bar.scale.y = s;
      bar.position.y = fullY * s;
      bar.material.opacity = s;
      if (t < 1) {
        requestAnimationFrame(step);
      } else if (onComplete) {
        onComplete();
      }
    }
    requestAnimationFrame(step);
  }

  function buildChart(data) {
    const oldBars = currentBars;
    oldBars.forEach(bar => {
      animateBar(bar, 1, 0.001, 250, () => {
        scene.remove(bar);
        if (bar.userData.label) bar.userData.label.remove();
      });
    });
    currentBars = [];

    const spacing = 1.3;
    const startX = -((data.length - 1) * spacing) / 2;

    data.forEach((d, i) => {
      const height = d.value * 0.45;
      const geometry = new THREE.BoxGeometry(0.8, height, 0.8);
      const material = new THREE.MeshStandardMaterial({ color: d.color, transparent: true, opacity: 0 });
      const bar = new THREE.Mesh(geometry, material);
      bar.position.x = startX + i * spacing;
      bar.userData.fullY = height / 2;
      bar.scale.y = 0.001;
      bar.position.y = 0;
      scene.add(bar);

      const label = document.createElement('div');
      label.textContent = '$' + d.value.toFixed(1) + 'M';
      label.style.position = 'absolute';
      label.style.fontFamily = 'system-ui, sans-serif';
      label.style.fontSize = '12px';
      label.style.color = '#eef1f7';
      label.style.whiteSpace = 'nowrap';
      labelsLayer.appendChild(label);
      bar.userData.label = label;

      currentBars.push(bar);

      setTimeout(() => animateBar(bar, 0.001, 1, 400), 260 + i * 60);
    });
  }

  document.querySelectorAll('.q-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      buildChart(datasets[btn.dataset.q]);
      const text = insightTexts[btn.dataset.q];
      document.getElementById('insightText').textContent = text;
      speak(text);
    });
  });

  buildChart(datasets.performance);

  const micBtn = document.getElementById('micBtn');
  const micStatus = document.getElementById('micStatus');
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  function matchQuestion(said) {
    const s = said.toLowerCase();
    if (s.includes('underperform') || s.includes('worst') || s.includes('declin')) return 'underperform';
    if (s.includes('trend') || s.includes('month')) return 'trend';
    if (s.includes('perform') || s.includes('revenue') || s.includes('quarter')) return 'performance';
    return null;
  }

  if (!SpeechRecognition) {
    micBtn.disabled = true;
    micStatus.textContent = 'Voice input not supported in this browser — try Chrome.';
  } else {
    const recognition = new SpeechRecognition();
    recognition.lang = 'en-US';

    micBtn.addEventListener('click', () => {
      recognition.start();
      micStatus.textContent = 'Listening...';
    });

    recognition.addEventListener('result', (e) => {
      const said = e.results[0][0].transcript;
      const matched = matchQuestion(said);
      micStatus.textContent = `Heard: "${said}"`;
      if (matched) {
        buildChart(datasets[matched]);
        const text = insightTexts[matched];
        document.getElementById('insightText').textContent = text;
        speak(text);
      }
    });

    recognition.addEventListener('error', () => {
      micStatus.textContent = "Didn't catch that — try again or use the buttons.";
    });
  }

  function updateLabels() {
    currentBars.forEach(bar => {
      if (!bar.userData.label) return;
      const topLocal = new THREE.Vector3(0, bar.geometry.parameters.height / 2 + 0.15, 0);
      const worldPos = bar.localToWorld(topLocal);
      worldPos.project(camera);
      const x = (worldPos.x * 0.5 + 0.5) * container.clientWidth;
      const y = (-worldPos.y * 0.5 + 0.5) * container.clientHeight;
      bar.userData.label.style.transform = `translate(-50%, -100%) translate(${x}px, ${y}px)`;
      bar.userData.label.style.opacity = bar.material.opacity;
    });
  }

  function animate() {
    requestAnimationFrame(animate);
    scene.rotation.y += 0.003;
    updateLabels();
    renderer.render(scene, camera);
  }
  animate();
</script>
</body>
</html>
